<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transpose Labs — Coming Soon</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root {
    --navy:   #1e2d4a;
    --blue:   #4477ee;
    --muted:  #6b7280;
    --border: #e5e7eb;
    --bg:     #f8f9fb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--navy);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }
  .card {
    max-width: 580px;
    width: 100%;
  }
  .logo-img {
    width: 260px;
    max-width: 80%;
    margin-bottom: 36px;
  }
  .badge {
    display: block;
    width: fit-content;
    margin: 0 auto 28px;
    padding: 7px 20px;
    border: 1.5px solid var(--blue);
    border-radius: 999px;
    font-size: 0.78rem;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--blue);
    line-height: 1.4;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--navy);
    margin-bottom: 16px;
    line-height: 1.15;
  }
  h1 span {
    color: var(--blue);
  }
  p.tagline {
    font-size: 1.05rem;
    line-height: 1.7;
    color: var(--muted);
    margin-bottom: 40px;
  }
  .divider {
    width: 40px;
    height: 3px;
    background: var(--blue);
    border-radius: 99px;
    margin: 0 auto 40px;
  }
  .contact {
    font-size: 0.95rem;
    color: var(--muted);
  }
  .contact a {
    color: var(--blue);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1.5px solid transparent;
    transition: border-color 0.15s;
  }
  .contact a:hover {
    border-bottom-color: var(--blue);
  }
  footer {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    font-size: 0.72rem;
    color: #adb5bd;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo-img" src="tl.png" alt="Transpose Labs">
    <div class="badge">Coming Soon</div>
    <h1>Something <span>cool</span> is coming.</h1>
    <div class="divider"></div>
    <p class="tagline">
      We turn complicated workflows into streamlined ones.<br>More details soon.
    </p>
    <div class="contact">
      Get in touch &mdash; <a href="mailto:hello@transposelabs.ai">hello@transposelabs.ai</a>
    </div>
  </div>
  <footer>&copy; 2026 Transpose Labs Pty Ltd | ABN 72 700 381 595</footer>
</body>
</html>
