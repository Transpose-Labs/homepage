<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transpose Labs — Coming Soon</title>
<style>
  :root {
    --navy: #1F3864;
    --navy-light: #2E4E8F;
    --ink: #1a1a2e;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }
  .card {
    max-width: 560px;
  }
  .logo {
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 28px;
    font-weight: 600;
  }
  h1 {
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 18px;
  }
  p.tagline {
    font-size: 1.1rem;
    line-height: 1.6;
    color: rgba(255,255,255,0.85);
    margin-bottom: 40px;
  }
  .badge {
    display: inline-block;
    padding: 10px 24px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 999px;
    font-size: 0.85rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 36px;
  }
  .contact {
    font-size: 0.95rem;
  }
  .contact a {
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.4);
  }
  .contact a:hover {
    border-bottom-color: #fff;
  }
  footer {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.45);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Transpose Labs</div>
    <div class="badge">Coming Soon</div>
    <h1>Something cool is coming.</h1>
    <p class="tagline">
      We turn complicated workflows into streamlined ones. More details soon.
    </p>
  </div>
  <footer>&copy; 2026 Transpose Labs Pty Ltd | ABN 72 700 381 595</footer>
</body>
</html>
